services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sacl-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-YourStrongPassword123!}"
      MSSQL_PID: "Express"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD:-YourStrongPassword123!}\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sacl-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./mssql:/mssql:ro
    entrypoint:
      [
        "/bin/bash",
        "-c",
        "/opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P \"${DB_PASSWORD:-YourStrongPassword123!}\" -C -i /mssql/01_schema.sql && /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P \"${DB_PASSWORD:-YourStrongPassword123!}\" -C -i /mssql/02_seed_master_data.sql",
      ]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sacl-backend
    restart: unless-stopped
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    environment:
      PORT: 5000
      DB_USER: "${DB_USER:-sa}"
      DB_PASSWORD: "${DB_PASSWORD:-YourStrongPassword123!}"
      DB_SERVER: mssql
      DB_PORT: 1433
      DB_DATABASE: "${DB_DATABASE:-SACL}"
      JWT_SECRET: "${JWT_SECRET:-super_secret_jwt_key_2026}"
      CORS_ORIGIN: "${CORS_ORIGIN:-}"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: "${REACT_APP_API_URL:-}"
    container_name: sacl-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  caddy:
    image: caddy:2-alpine
    container_name: sacl-caddy
    profiles: ["domain"]
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-localhost}"
      API_DOMAIN: "${API_DOMAIN:-api.localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mssql_data:
  caddy_data:
  caddy_config:
